<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">apple-workflow-automation</title>
  <desc id="desc">Weekly reviews, meeting prep and quick capture for Calendar, Reminders and Notes, scripted with JavaScript for Automation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1f4d"/>
      <stop offset="1" stop-color="#2456c8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.35" r="0.55">
      <stop offset="0" stop-color="#7aa2ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7aa2ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#050d24" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#dots)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>

  <!-- Wordmark -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="64" y="118" font-size="44" font-weight="700" fill="#ffffff" letter-spacing="-0.5">apple-workflow-automation</text>
    <text x="64" y="158" font-size="19" fill="#c9d8ff">Your week in Calendar, Reminders and Notes, reviewed and prepared</text>
    <text x="64" y="184" font-size="19" fill="#c9d8ff">by scripts you can read, test and schedule.</text>
    <g font-size="13" font-weight="600" fill="#ffffff">
      <rect x="64" y="212" width="58" height="28" rx="14" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="93" y="231" text-anchor="middle">JXA</text>
      <rect x="132" y="212" width="94" height="28" rx="14" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="179" y="231" text-anchor="middle">Shortcuts</text>
      <rect x="236" y="212" width="82" height="28" rx="14" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="277" y="231" text-anchor="middle">launchd</text>
      <rect x="328" y="212" width="112" height="28" rx="14" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="384" y="231" text-anchor="middle">local only</text>
    </g>
  </g>

  <!-- Calendar card -->
  <g filter="url(#shadow)" transform="translate(724 52) rotate(-4)">
    <rect width="230" height="190" rx="18" fill="#ffffff" fill-opacity="0.95"/>
    <path d="M0 18 a18 18 0 0 1 18 -18 h194 a18 18 0 0 1 18 18 v24 h-230 z" fill="#2456c8"/>
    <rect x="18" y="14" width="70" height="12" rx="6" fill="#ffffff" fill-opacity="0.85"/>
    <g fill="#dbe5ff">
      <rect x="18" y="58" width="26" height="22" rx="5"/><rect x="48" y="58" width="26" height="22" rx="5"/><rect x="78" y="58" width="26" height="22" rx="5"/><rect x="108" y="58" width="26" height="22" rx="5"/><rect x="138" y="58" width="26" height="22" rx="5"/><rect x="168" y="58" width="26" height="22" rx="5"/><rect x="198" y="58" width="14" height="22" rx="5"/>
      <rect x="18" y="86" width="26" height="22" rx="5"/><rect x="48" y="86" width="26" height="22" rx="5"/><rect x="108" y="86" width="26" height="22" rx="5"/><rect x="138" y="86" width="26" height="22" rx="5"/><rect x="168" y="86" width="26" height="22" rx="5"/><rect x="198" y="86" width="14" height="22" rx="5"/>
      <rect x="18" y="114" width="26" height="22" rx="5"/><rect x="48" y="114" width="26" height="22" rx="5"/><rect x="78" y="114" width="26" height="22" rx="5"/><rect x="108" y="114" width="26" height="22" rx="5"/><rect x="168" y="114" width="26" height="22" rx="5"/><rect x="198" y="114" width="14" height="22" rx="5"/>
      <rect x="18" y="142" width="26" height="22" rx="5"/><rect x="48" y="142" width="26" height="22" rx="5"/><rect x="78" y="142" width="26" height="22" rx="5"/><rect x="108" y="142" width="26" height="22" rx="5"/><rect x="138" y="142" width="26" height="22" rx="5"/>
    </g>
    <rect x="78" y="86" width="26" height="22" rx="5" fill="#2456c8"/>
    <rect x="138" y="114" width="26" height="22" rx="5" fill="#0b1f4d"/>
    <rect x="168" y="142" width="44" height="22" rx="5" fill="#5b8cff"/>
  </g>

  <!-- Note card -->
  <g filter="url(#shadow)" transform="translate(930 92) rotate(5)">
    <rect width="200" height="176" rx="16" fill="#ffffff" fill-opacity="0.97"/>
    <rect x="20" y="22" width="120" height="14" rx="7" fill="#0b1f4d"/>
    <rect x="20" y="48" width="60" height="8" rx="4" fill="#9fb4e8"/>
    <g fill="#c8d5f5">
      <rect x="20" y="72" width="160" height="7" rx="3.5"/>
      <rect x="20" y="88" width="136" height="7" rx="3.5"/>
      <rect x="20" y="104" width="150" height="7" rx="3.5"/>
    </g>
    <rect x="20" y="126" width="80" height="9" rx="4.5" fill="#2456c8"/>
    <rect x="20" y="144" width="120" height="7" rx="3.5" fill="#c8d5f5"/>
  </g>

  <!-- Reminders card -->
  <g filter="url(#shadow)" transform="translate(640 176) rotate(-1.5)">
    <rect width="190" height="104" rx="16" fill="#ffffff" fill-opacity="0.97"/>
    <g>
      <circle cx="28" cy="28" r="9" fill="#2456c8"/>
      <path d="M23.5 28 l3 3 l6 -6" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="46" y="24" width="110" height="8" rx="4" fill="#9fb4e8"/>
      <circle cx="28" cy="54" r="9" fill="#2456c8"/>
      <path d="M23.5 54 l3 3 l6 -6" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="46" y="50" width="88" height="8" rx="4" fill="#9fb4e8"/>
      <circle cx="28" cy="80" r="8" fill="none" stroke="#2456c8" stroke-width="2.2"/>
      <rect x="46" y="76" width="124" height="8" rx="4" fill="#0b1f4d" fill-opacity="0.8"/>
    </g>
  </g>
</svg>
